[package]
name = "slimg-jpegli-sys"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Private C shim and static builds of Google's standalone Jpegli"
repository = "https://github.com/yunho-c/slimg"
links = "slimg_jpegli"
include = ["/Cargo.toml", "/build.rs", "/build_support.rs", "/upstream.json", "/src/**", "/shim/**", "/native/**", "/examples/**", "/tests/**", "/LICENSE", "/README.md"]

[features]
default = ["vendored"]
vendored = ["dep:cmake"]

[build-dependencies]
cmake = { version = "0.1", optional = true }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
tempfile = "3.25.0"

[package.metadata.docs.rs]
no-default-features = true
