[package]
name = "slimg-ffi"
version = "0.5.1"
edition = "2024"
license = "MIT"
description = "UniFFI bindings for slimg-core image optimization library"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["jpeg-backend-mozjpeg"]
jpeg-backend-mozjpeg = ["slimg-core/jpeg-backend-mozjpeg"]
jpeg-backend-jpegli = ["slimg-core/jpeg-backend-jpegli"]

[dependencies]
slimg-core = { path = "../slimg-core", default-features = false }
uniffi = { version = "0.31", features = ["cli"] }
thiserror = "2"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
