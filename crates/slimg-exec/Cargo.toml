[package]
name = "slimg-exec"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Execution planning and batch scheduling for slimg workloads"
repository = "https://github.com/clroot/slimg"
homepage = "https://github.com/clroot/slimg"

[features]
default = ["jpeg-backend-mozjpeg"]
jpeg-backend-mozjpeg = ["slimg-core/jpeg-backend-mozjpeg"]
jpeg-backend-jpegli = ["slimg-core/jpeg-backend-jpegli"]

[dependencies]
slimg-core = { path = "../slimg-core", default-features = false }
