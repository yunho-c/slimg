[package]
name = "slimg-core"
version = "0.5.1"
edition = "2024"
license = "MIT"
description = "Image optimization library — encode, decode, convert, resize with MozJPEG, OxiPNG, WebP, AVIF, and QOI"
repository = "https://github.com/clroot/slimg"
homepage = "https://github.com/clroot/slimg"
readme = "README.md"
keywords = ["image", "optimization", "compression", "webp", "avif"]
categories = ["multimedia::images", "encoding"]

[features]
default = ["jpeg-backend-mozjpeg"]
jpeg-backend-mozjpeg = ["dep:mozjpeg"]
jpeg-backend-jpegli = ["libjxl-sys/jpegli"]
jxl-encoder-gjxl = ["dep:gjxl"]
pngquant = ["dep:imagequant", "dep:png"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
imagequant = { version = "4.4.1", default-features = false, optional = true }
gjxl = { version = "0.0.1", path = "../../../gjxl-rust/rust/gjxl", optional = true }
libjxl-sys = { version = "0.1", path = "../libjxl-sys", package = "slimg-libjxl-sys" }
mozjpeg = { version = "0.10", optional = true }
oxipng = { version = "10", default-features = false, features = ["parallel", "zopfli"] }
png = { version = "0.18", optional = true }
imgref = "1"
rapid-qoi = "0.6"
ravif = "0.13"
rgb = "0.8"
thiserror = "2"
webp = { version = "0.3", default-features = false }
zenavif = "0.1.5"
zenpixels-convert = { version = "0.2", features = ["rgb"] }

[dev-dependencies]
criterion = "0.5"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "codec_bench"
harness = false

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "natural_bench"
harness = false
