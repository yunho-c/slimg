[package]
name = "slimg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Image optimization CLI — convert, compress, and resize images using MozJPEG, OxiPNG, WebP, AVIF, and QOI"
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["image", "optimization", "cli", "compression", "webp"]
categories = ["multimedia::images", "command-line-utilities"]

[features]
default = ["jpeg-backend-mozjpeg"]
jpeg-backend-mozjpeg = ["slimg-core/jpeg-backend-mozjpeg"]
jpeg-backend-jpegli = ["slimg-core/jpeg-backend-jpegli"]

[dependencies]
slimg-core = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
anyhow = "1"
rayon = "1.11.0"
indicatif = "0.18.4"

[dev-dependencies]
tempfile = "3.25.0"
assert_cmd = "2"
predicates = "3"
